let answers = Array(questions.length).fill(null);

// 渲染40題
function renderQuiz(){
  questionsWrap.innerHTML = '';
  answers.fill(null);
  questions.forEach((item, idx)=>{
    const div = document.createElement('div');
    div.className = 'question';
    div.innerHTML = `<div class="q-title">${idx+1}. ${item.q}</div>`;
    const optWrap = document.createElement('div');
    optWrap.className = 'opt-group';
    optValues.forEach((score, oIdx)=>{
      const optEl = document.createElement('div');
      optEl.className = 'opt';
      optEl.textContent = optLabels[oIdx];
      optEl.dataset.idx = idx;
      optEl.dataset.val = score;
      optEl.onclick = ()=>{
        document.querySelectorAll(`.opt[data-idx="${idx}"]`).forEach(e=>e.classList.remove('selected'));
        optEl.classList.add('selected');
        answers[idx] = Number(optEl.dataset.val);
        submitBtn.disabled = answers.some(v=>v===null);
      };
      optWrap.appendChild(optEl);
    });
    div.appendChild(optWrap);
    questionsWrap.appendChild(div);
  });
  submitBtn.disabled = true;
}

// 計算分數

    let s = raw;
    if(item.reverse){
      s = 6 - raw; // 反向題：1↔5,2↔4，3維持3
    }
    score[item.side] += s;
  });

  const totalEI = score.E + score.I;
  const totalSN = score.S + score.N;
  const totalTF = score.T + score.F;
  const totalJP = score.J + score.P;
  const pct = {
    E: (score.E/totalEI*100).toFixed(1),
    I: (score.I/totalEI*100).toFixed(1),
    S: (score.S/totalSN*100).toFixed(1),
    N: (score.N/totalSN*100).toFixed(1),
    T: (score.T/totalTF*100).toFixed(1),
    F: (score.F/totalTF*100).toFixed(1),
    J: (score.J/totalJP*100).toFixed(1),
    P: (score.P/totalJP*100).toFixed(1),
  };
  // 判斷類型 + 邊界檢查
  let code = "";
  let warnList = [];
  const diffEI = Math.abs(pct.E - pct.I);
  const diffSN = Math.abs(pct.S - pct.N);
  const diffTF = Math.abs(pct.T - pct.F);
  const diffJP = Math.abs(pct.J - pct.P);
  code += (pct.E >= pct.I) ? "E":"I";
  code += (pct.S >= pct.N) ? "S":"N";
  code += (pct.T >= pct.F) ? "T":"F";
  code += (pct.J >= pct.P) ? "J":"P";
  if(diffEI <10) warnList.push("E/I");
  if(diffSN <10) warnList.push("S/N");
  if(diffTF <10) warnList.push("T/F");
  if(diffJP <10) warnList.push("J/P");
  return {score,pct,code,warnList};
}

// 繪製八邊雷達圖
function drawRadar(pct){
  if(radarChart) radarChart.destroy();
  const ctx = canvas.getContext('2d');
  radarChart = new Chart(ctx,{
    type:"radar",
    data:{
      labels:["E","I","S","N","T","F","J","P"],
      datasets:[{
        label:"人格傾向百分比",
        data:[pct.E,pct.I,pct.S,pct.N,pct.T,pct.F,pct.J,pct.P],
        backgroundColor:"rgba(37, 99, 235,0.2)",
        borderColor:"rgba(37, 99, 235,1)",
        pointBackgroundColor:"rgba(37, 99, 235,1)",
      }]
    },
    options:{
      scales:{
        r:{min:0,max:100,ticks:{stepSize:20}}
      }
    }
  });
}

function showResult(){
  const res = calcScore();
  const info = typeMap[res.code];
  typeCode.textContent = `${res.code} ${info.name}`;
  // 維度文字
  dimWrap.innerHTML = `
    <div class="dim-item">E:${res.pct.E}%｜I:${res.pct.I}%</div>
    <div class="dim-item">S:${res.pct.S}%｜N:${res.pct.N}%</div>
    <div class="dim-item">T:${res.pct.T}%｜F:${res.pct.F}%</div>
    <div class="dim-item">J:${res.pct.J}%｜P:${res.pct.P}%</div>
  `;
  // 邊界警告
  if(res.warnList.length>0){
    warnBox.style.display="block";
    warnBox.innerText = `⚠️ 邊界維度：${res.warnList.join("、")}，此部分傾向不明顯，重測有可能得到不同人格類型。`;
  }else{
    warnBox.style.display="none";
  }
  // 完整資訊
  typeIntro.innerHTML = `
  <div class="block"><strong>簡介：</strong>${info.intro}</div>
  <div class="block"><h4>✅ 優點</h4>${info.good}</div>
  <div class="block"><h4>⚠️ 盲點</h4>${info.weak}</div>
  <div class="block"><h4>💼 適合職業</h4>${info.job}</div>
  <div class="block"><h4>❤️ 感情觀</h4>${info.love}</div>
  `;
  drawRadar(res.pct);
  quizBox.style.display='none';
  resultBox.style.display='block';
}

startBtn.onclick = ()=>{
  startBox.style.display='none';
  quizBox.style.display='block';
  renderQuiz();
};
submitBtn.onclick = showResult;
restartBtn.onclick = ()=>{
  resultBox.style.display='none';
  startBox.style.display='block';
};
</script>
